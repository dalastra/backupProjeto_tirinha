<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar__logo">
            <img src="assets/logo.png" alt="Logo">
        </div>

        <nav class="sidebar__menu">

            <a href="index.html" class="sidebar__item">
                <i class="ri-dashboard-line"></i>
                DASHBOARD
            </a>

            <a href="produtos.html" class="sidebar__item sidebar__item--active">
                <i class="ri-box-3-line"></i>
                PRODUTOS
            </a>

            <a href="pedidos.html" class="sidebar__item">
                <i class="ri-shopping-cart-line"></i>
                PEDIDOS
            </a>

            <a href="clientes.html" class="sidebar__item">
                <i class="ri-user-3-line"></i>
                CLIENTES
            </a>

            <a href="perfil.html" class="sidebar__item">
                <i class="ri-user-settings-line"></i>
                PERFIL
            </a>


        </nav>
    </aside>

    <main class="main">

        <header class="main__header">
            <h1>PRODUTOS</h1>
        </header>



    </main>
    

    <body class="product__body">

    <div class="product__container">
        <div class="product__right">
            <form class="product__form">
                <div class="product__group">
                    <label for="email" class="product__label">ID</label>
                    <input type="email" id="email" class="product__input" placeholder="000...">
                </div>

                <div class="product__group">
                    <label for="senha" class="product__label">NOME</label>
                    <input type="password" id="senha" class="product__input" placeholder="Digite o nome do produto...">
                </div>

                <div class="product__group">
                    <label for="senha" class="product__label">PREÇO</label>
                    <input type="password" id="senha" class="product__input" placeholder="R$0.000,00...">
                </div>

                <div class="product__group">
                    <label for="senha" class="product__label">ESTOQUE</label>
                    <input type="password" id="senha" class="product__input" placeholder="000...">
                </div>

                <button type="button" class="product__button" onclick="window.location.href='produtos.html'">ADICIONAR PRODUTO</button>

            </form>
        </div>

    </div>

</body>
</html>
