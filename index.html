<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Login - Tirinha Embalagens</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="login__body">

    <div class="login__container">
        
        <div class="login__left">
            <div class="login__logo">
                <img src="assets/logo.png" alt="Logo Tirinha Embalagens">
            </div>
        </div>

        <div class="login__right">
            <h1 class="login__title">LOGIN</h1>

            <form class="login__form">
                <div class="login__group">
                    <label for="email" class="login__label">EMAIL</label>
                    <input type="email" id="email" class="login__input" placeholder="Digite seu email...">
                </div>

                <div class="login__group">
                    <label for="senha" class="login__label">SENHA</label>
                    <input type="password" id="senha" class="login__input" placeholder="Digite sua senha...">
                </div>

                <button type="button" class="login__button" onclick="window.location.href='dashboard.html'">ENTRAR</button>

                <div class="login__footer">
                    <p>Esqueceu sua senha?</p>
                    <a href="loginsenha.html" class="login__link">Clique aqui!</a>
                </div>
            </form>
        </div>

    </div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
