<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar__logo">
            <img src="assets/logo.png" alt="Logo">
        </div>

        <nav class="sidebar__menu">

            <a href="index.html" class="sidebar__item">
                <i class="ri-dashboard-line"></i>
                DASHBOARD
            </a>

            <a href="produtos.html" class="sidebar__item ">
                <i class="ri-box-3-line"></i>

            </a>

            <a href="pedidos.html" class="sidebar__item">
                <i class="ri-shopping-cart-line"></i>

            </a>

            <a href="clientes.html" class="sidebar__item">

        <header class="main__header">
            <h1>PERFIL</h1>
        </header>

        <section class="profile-card">
            <div class="profile-info">

                    <span class="profile-label">NOME:</span>
                    <span class="profile-value">NICOLAS CAMPOS DALASTRA</span>
                </div>

                <div class="profile-group">
                    <span class="profile-label">EMAIL:</span>
                    <span class="profile-value">ncamposdalastra@gmail.com</span>
                </div>

                <div class="profile-group">
                    <span class="profile-label">CARGO:</span>
                    <span class="profile-value">GERENTE</span>
                </div>
            </div>

            <div class="profile-avatar">
                <i class="ri-user-fill" style="font-size: 120px; color: #fff;"></i>
            </div>

            <button class="btn-edit-profile" onclick="window.location.href='editperfil.html'">
                <i class="ri-pencil-line"></i>
                EDITAR
            </button>
        </section>

    </main>

<script src="js/menu.js"></script>
